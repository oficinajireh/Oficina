<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enlaces</title>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#241536">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --navy-950:#241536;
    --navy-900:#2c1c40;
    --navy-800:#3a2856;
    --indigo-600:#ff6a39;
    --indigo-700:#e8531f;
    --gold-500:#f0a83d;
    --coral-600:#e8397c;
    --paper:#fdf6ec;
    --paper-line:#f0e2cf;
    --ink-900:#2a1f1a;
    --ink-600:#7d6c60;
    --radius-lg:18px;
    --radius-pill:50px;
    --shadow-card:0 8px 22px rgba(42,25,54,.10), 0 2px 6px rgba(42,25,54,.06);
    --shadow-card-hover:0 14px 30px rgba(42,25,54,.18), 0 4px 10px rgba(42,25,54,.08);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
body{
    margin:0;
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--ink-900);
    background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255,106,57,.10), transparent 60%),
        var(--paper);
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
}

.stub{
    width:100%;
    max-width:440px;
}

/* ---- Cabecera: avatar circular + nombre, con el borde
   "perforado" de ticket que ya usa el catálogo en sus tarjetas ---- */
.header{
    text-align:center;
    margin-bottom:28px;
}
.avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    margin:0 auto 16px;
    background:linear-gradient(135deg, var(--navy-950), var(--navy-800));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:var(--shadow-card);
    border:3px solid #fff;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar span{
    font-family:var(--font-display);
    color:#fff;
    font-size:30px;
    font-weight:700;
}
.nombre{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-.01em;
}
.subtitulo{
    margin:0;
    color:var(--ink-600);
    font-size:14.5px;
}

/* ---- Botones tipo "talón de ticket": borde recto a la izquierda,
   filo dentado a la derecha, como si el link se pudiera arrancar ---- */
.links{
    list-style:none;
    margin:32px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
}
.link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 22px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius-lg);
    text-decoration:none;
    color:var(--ink-900);
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    box-shadow:var(--shadow-card);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    cursor:pointer;
    appearance:none;
    text-align:left;
}
.link-btn:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-card-hover);
    border-color:var(--paper-line);
}
.link-btn:active{transform:translateY(0);}
.link-ico{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}
.link-ico svg{width:19px;height:19px;fill:currentColor;}
.link-btn.whatsapp .link-ico{background:#25D366;}
.link-btn.instagram .link-ico{background:radial-gradient(circle at 30% 110%, #ffdb8c, #ee2a7b 45%, #6228d7 90%);}
.link-btn.facebook .link-ico{background:#1877F2;}
.link-btn.tiktok .link-ico{background:#000;}
.link-btn.youtube .link-ico{background:#FF0000;}
.link-btn.twitter .link-ico{background:#000;}
.link-btn.enlace .link-ico{background:var(--navy-800);}
.link-btn.ubicacion .link-ico{background:var(--indigo-600);}

/* Catálogo: botón destacado — la acción principal de la página */
.link-btn.catalogo{
    background:linear-gradient(135deg, var(--navy-950), var(--navy-800));
    border-color:transparent;
    color:#fff;
}
.link-btn.catalogo .link-sub{color:rgba(255,255,255,.65);}
.link-btn.catalogo .link-arrow{color:rgba(255,255,255,.65);}
.link-btn.catalogo .link-ico{background:var(--gold-500);color:var(--navy-950);}

/* ---- Temas de color (mismo criterio que el catálogo: se activan
   con data-tema="azul|verde|rojo" en <body>; sin el atributo se usa
   la paleta navy original) ---- */
body[data-tema="azul"]{
    --navy-950:#0b1f3a;
    --navy-800:#16335c;
    --indigo-600:#2f7df5;
    --indigo-700:#1f63d1;
}
body[data-tema="verde"]{
    --navy-950:#0c2417;
    --navy-800:#16402a;
    --indigo-600:#1fa257;
    --indigo-700:#168447;
}
body[data-tema="rojo"]{
    --navy-950:#2a0f12;
    --navy-800:#481a1f;
    --indigo-600:#e0413f;
    --indigo-700:#bf2e2e;
}
.link-label{flex:1;}
.link-sub{
    display:block;
    font-family:var(--font-body);
    font-weight:400;
    font-size:12.5px;
    color:var(--ink-600);
    margin-top:2px;
}
.link-arrow{flex:0 0 auto;color:var(--ink-600);font-size:18px;}

.estado{
    text-align:center;
    color:var(--ink-600);
    font-size:14px;
    padding:40px 0;
}

.footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-600);
}

/* ---- Modal de mapa ---- */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(36,21,54,.55);
    z-index:9000;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
    width:100%;
    max-width:480px;
    background:#fff;
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 24px 60px rgba(36,21,54,.35);
}
.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--paper-line);
}
.modal-head h2{
    font-family:var(--font-display);
    font-size:16px;
    margin:0;
}
.modal-close{
    border:none;
    background:var(--paper);
    width:30px;
    height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    color:var(--ink-900);
}
.modal-body iframe{
    width:100%;
    height:300px;
    border:0;
    display:block;
}
.modal-foot{
    padding:14px 18px 18px;
}
.modal-direccion{
    font-size:14px;
    color:var(--ink-600);
    margin:0 0 12px;
}
.modal-cta{
    display:block;
    text-align:center;
    padding:12px;
    border-radius:var(--radius-pill);
    background:var(--indigo-600);
    color:#fff;
    text-decoration:none;
    font-family:var(--font-display);
    font-weight:600;
    font-size:14.5px;
}
</style>
</head>
<body>

<main class="stub">
    <div class="header">
        <div class="avatar" id="avatar"><span id="avatarInicial">?</span></div>
        <h1 class="nombre" id="nombreNegocio">Cargando…</h1>
    </div>

    <div id="estadoCarga" class="estado">Cargando enlaces…</div>

    <ul class="links" id="listaLinks" style="display:none;"></ul>

    <p class="footer" id="footerTexto"></p>
</main>

<!-- MODAL MAPA -->
<div class="modal-overlay" id="modalMapa" onclick="if(event.target===this) cerrarMapa()">
    <div class="modal-box">
        <div class="modal-head">
            <h2>Cómo llegar</h2>
            <button class="modal-close" onclick="cerrarMapa()" aria-label="Cerrar">✕</button>
        </div>
        <div class="modal-body">
            <iframe id="mapaIframe" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="modal-foot">
            <p class="modal-direccion" id="modalDireccionTexto"></p>
            <a class="modal-cta" id="modalAbrirMaps" href="#" target="_blank" rel="noopener">Abrir en Google Maps</a>
        </div>
    </div>
</div>

<script>

function detectarRed(url){
    let host = "";
    try{ host = new URL(url).hostname.toLowerCase(); }catch(e){ host = url.toLowerCase(); }

    if(host.includes("instagram.com")){
        return { clase:"instagram", icono:"instagram", titulo:"Instagram", sub:"Seguinos" };
    }
    if(host.includes("facebook.com") || host.includes("fb.com")){
        return { clase:"facebook", icono:"facebook", titulo:"Facebook", sub:"Nuestra página" };
    }
    if(host.includes("tiktok.com")){
        return { clase:"tiktok", icono:"tiktok", titulo:"TikTok", sub:"Mirá nuestros videos" };
    }
    if(host.includes("youtube.com") || host.includes("youtu.be")){
        return { clase:"youtube", icono:"youtube", titulo:"YouTube", sub:"Nuestro canal" };
    }
    if(host.includes("twitter.com") || host.includes("x.com")){
        return { clase:"twitter", icono:"twitter", titulo:"X", sub:"Seguinos" };
    }
    // Red no reconocida: se muestra igual, con ícono y estilo genérico,
    // para no perder ningún enlace que se cargue en el futuro.
    return { clase:"enlace", icono:"enlace", titulo: host.replace(/^www\./, "") || "Enlace", sub:"" };
}

function crearLinkItem({clase, icono, titulo, sub, href, onClick}){
    const li = document.createElement("li");
    const el = document.createElement(href ? "a" : "button");
    el.className = "link-btn " + clase;
    if(href){
        el.href = href;
        el.target = "_blank";
        el.rel = "noopener";
    }
    if(onClick) el.addEventListener("click", onClick);
    el.innerHTML = `
        <span class="link-ico">${icono}</span>
        <span class="link-label">${titulo}${sub ? `<span class="link-sub">${sub}</span>` : ""}</span>
        <span class="link-arrow">›</span>
    `;
    li.appendChild(el);
    return li;
}

async function cargarLanding(){
    const estadoEl = document.getElementById("estadoCarga");
    const listaEl = document.getElementById("listaLinks");

    let apiUrl = "";
    try{
        const cfgRes = await fetch("config.json", { cache: "no-store" });
        const cfg = await cfgRes.json();
        // El config.json de este sitio usa "apiUrl" (camelCase); se
        // acepta también "API_URL" por si en otra instalación se llamó
        // distinto.
        apiUrl = cfg.apiUrl || cfg.API_URL || "";
    }catch(e){
        estadoEl.textContent = "No se pudo cargar config.json.";
        return;
    }

    if(!apiUrl){
        estadoEl.textContent = "Falta configurar la URL de la API en config.json.";
        return;
    }

    let config;
    try{
        const res = await fetch(apiUrl + "?action=configLanding", { cache: "no-store" });
        const data = await res.json();
        if(!data.success) throw new Error(data.message || "Respuesta inválida");
        config = data.config;
    }catch(e){
        estadoEl.textContent = "No se pudieron cargar los datos. Probá de nuevo en un momento.";
        return;
    }

    // Cabecera
    document.title = config.nombre || "Enlaces";
    document.getElementById("nombreNegocio").textContent = config.nombre || "";
    document.getElementById("footerTexto").textContent = config.footerCopyright || (config.nombre ? ("© " + new Date().getFullYear() + " " + config.nombre) : "");

    // Tema de color: mismo mecanismo que el catálogo (data-tema en
    // <body>). Si el negocio activó un gradiente propio (Apariencia →
    // "Gradiente propio"), ese pisa directamente navy-950/navy-800,
    // sin importar el tema elegido.
    if(config.tema && config.tema !== "navy"){
        document.body.setAttribute("data-tema", config.tema);
    }
    if(config.gradPersonalizado && config.gradA && config.gradB){
        document.body.style.setProperty("--navy-950", config.gradA);
        document.body.style.setProperty("--navy-800", config.gradB);
    }

    const avatarEl = document.getElementById("avatar");
    if(config.iconoUrl){
        avatarEl.innerHTML = `<img src="${config.iconoUrl}" alt="${config.nombre || ""}">`;
    }else{
        document.getElementById("avatarInicial").textContent = (config.nombre || "?").trim().charAt(0).toUpperCase();
    }

    // Botones
    listaEl.innerHTML = "";

    if(config.urlCatalogo){
        listaEl.appendChild(crearLinkItem({
            clase: "catalogo",
            icono: ICONOS.catalogo,
            titulo: "Ver catálogo",
            sub: "Precios mayoristas online",
            href: config.urlCatalogo
        }));
    }

    if(config.whatsappNumero){
        listaEl.appendChild(crearLinkItem({
            clase: "whatsapp",
            icono: ICONOS.whatsapp,
            titulo: "WhatsApp",
            sub: "Escribinos directo",
            href: "https://wa.me/" + config.whatsappNumero
        }));
    }

    // Redes sociales: se detecta automáticamente de qué red es cada
    // enlace mirando su dominio, así no depende de en qué columna de
    // la hoja lo haya cargado el negocio.
    (config.enlaces || []).forEach(url => {
        const red = detectarRed(url);
        listaEl.appendChild(crearLinkItem({
            clase: red.clase,
            icono: ICONOS[red.icono],
            titulo: red.titulo,
            sub: red.sub,
            href: url
        }));
    });

    if(config.direccion){
        listaEl.appendChild(crearLinkItem({
            clase: "ubicacion",
            icono: ICONOS.geo,
            titulo: "Cómo llegar",
            sub: config.direccion,
            onClick: (ev) => { ev.preventDefault(); abrirMapa(config.direccion); }
        }));
    }

    if(!listaEl.children.length){
        estadoEl.textContent = "Todavía no hay enlaces cargados.";
        return;
    }

    estadoEl.style.display = "none";
    listaEl.style.display = "flex";
}

function abrirMapa(direccion){
    const q = encodeURIComponent(direccion);
    document.getElementById("mapaIframe").src = `https://www.google.com/maps?q=${q}&output=embed`;
    document.getElementById("modalDireccionTexto").textContent = direccion;
    document.getElementById("modalAbrirMaps").href = `https://www.google.com/maps/search/?api=1&query=${q}`;
    document.getElementById("modalMapa").classList.add("open");
}
function cerrarMapa(){
    document.getElementById("modalMapa").classList.remove("open");
    document.getElementById("mapaIframe").src = "";
}

cargarLanding();
</script>
</body>
</html>
