<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso · VeekPOS</title>

<link href="vendor/fonts/fonts.css" rel="stylesheet">

<style>

:root{
  --navy-950: #070d1f;
  --navy-900: #0b1633;
  --navy-800: #122047;
  --navy-700: #1a2c5c;
  --navy-600: #24397a;

  --slate-50:  #f7f8fa;
  --slate-200: #e2e6ed;
  --slate-300: #cbd2dd;
  --slate-400: #99a3b3;
  --slate-500: #6b7585;
  --slate-600: #4c5567;

  --gold-500: #d99a3d;
  --red-500:  #dc2626;
  --red-50:   #fdecec;
  --blue-500: #2563eb;

  --font-ui:   'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  min-height:100vh;
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(160deg, var(--navy-950) 0%, var(--navy-800) 100%);
  background-image:
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 13px),
    linear-gradient(160deg, var(--navy-950) 0%, var(--navy-800) 100%);
}

/* ===== Marca, arriba de la tarjeta ===== */

.login-brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:26px;
}

.login-brand .mark{
  width:42px; height:42px; border-radius:11px;
  background:linear-gradient(135deg, var(--blue-500), var(--navy-600));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; color:#fff;
  box-shadow:0 4px 14px rgba(37,99,235,.4);
  flex-shrink:0;
}

.login-brand .label{
  color:#fff; text-align:left; line-height:1.15;
}
.login-brand .label strong{
  display:block; font-size:17px; font-weight:700; letter-spacing:.02em;
}
.login-brand .label small{
  display:block; font-size:11px; font-weight:600; letter-spacing:.12em;
  color:rgba(255,255,255,.5); margin-top:2px;
}

/* ===== Tarjeta de login, con perforación estilo recibo ===== */

.login-wrap{
  width:100%;
  max-width:380px;
}

.login-card{
  position:relative;
  background:#fff;
  border-radius:18px;
  padding:32px 28px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}

.login-card::before,
.login-card::after{
  content:"";
  position:absolute;
  top:-9px;
  width:18px; height:18px;
  border-radius:50%;
  background:var(--navy-900);
}
.login-card::before{ left:24px; }
.login-card::after{ right:24px; }

.login-title{
  font-size:19px; font-weight:700; color:var(--navy-900);
  margin:0 0 4px;
}
.login-sub{
  font-size:13.5px; color:var(--slate-500);
  margin:0 0 24px;
}

.login-field{ margin-bottom:16px; }
.login-field label{
  display:block; font-size:12.5px; font-weight:600;
  color:var(--slate-600); margin-bottom:6px;
}

.login-input-wrap{ position:relative; }
.login-input-wrap .ic{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  font-size:15px; opacity:.55; pointer-events:none;
}

.login-field input{
  width:100%;
  border:1.5px solid var(--slate-200);
  border-radius:10px;
  padding:11px 14px 11px 38px;
  font-size:14.5px;
  font-family:var(--font-ui);
  color:var(--navy-900);
  transition:border-color .15s, box-shadow .15s;
}
.login-field input:focus{
  outline:none;
  border-color:var(--blue-500);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.login-toggle-pass{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  font-size:13px; color:var(--slate-400);
  padding:6px 8px; border-radius:6px;
}
.login-toggle-pass:hover{ color:var(--slate-600); background:var(--slate-50); }

.login-error{
  display:none;
  align-items:center; gap:8px;
  background:var(--red-50); color:var(--red-500);
  font-size:13px; font-weight:600;
  border-radius:10px; padding:10px 12px;
  margin-bottom:16px;
}
.login-error.show{ display:flex; }

.login-btn{
  width:100%;
  background:var(--navy-900);
  color:#fff;
  border:none; border-radius:10px;
  padding:13px;
  font-size:15px; font-weight:700;
  font-family:var(--font-ui);
  cursor:pointer;
  transition:background .15s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.login-btn:hover{ background:var(--navy-800); }
.login-btn:disabled{ background:var(--slate-300); cursor:not-allowed; }

.login-spinner{
  width:15px; height:15px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:login-spin .6s linear infinite;
  display:none;
}
.login-btn.loading .login-spinner{ display:inline-block; }
.login-btn.loading .login-btn-text{ display:none; }

@keyframes login-spin{
  to{ transform:rotate(360deg); }
}

.login-footnote{
  text-align:center;
  font-size:12px;
  color:rgba(255,255,255,.45);
  margin-top:22px;
}

@media (prefers-reduced-motion:reduce){
  .login-spinner{ animation:none; }
}

</style>
</head>
<body>

<div class="login-wrap">

  <div class="login-brand">
    <div class="mark" id="loginMark"></div>
    <div class="label">
      <strong id="loginLabelTexto"></strong>
      <small>PANEL ADMIN</small>
    </div>
  </div>

  <div class="login-card">
    <h1 class="login-title">Acceso administrativo</h1>
    <p class="login-sub">Ingresá tus credenciales para entrar al panel.</p>

    <div class="login-error" id="loginError">
      <span>⚠️</span>
      <span id="loginErrorTexto">Usuario o contraseña incorrectos.</span>
    </div>

    <form id="loginForm" autocomplete="on">

      <div class="login-field">
        <label for="usuario">Usuario</label>
        <div class="login-input-wrap">
                    <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>
        <div class="login-input-wrap">
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
          <button type="button" class="login-toggle-pass" id="btnTogglePass" onclick="togglePassword()" aria-label="Mostrar contraseña">Ver</button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="btnLogin">
        <span class="login-spinner"></span>
        <span class="login-btn-text">Ingresar</span>
      </button>

    </form>
  </div>

  <p class="login-footnote">Acceso restringido — uso exclusivo del personal autorizado.</p>

</div>

<script src="veek-auth.js"></script>
<script>

// En la app de escritorio (Electron), la URL de Apps Script se
// configura una sola vez en setup.html y queda guardada en SQLite —
// así el mismo instalador sirve para cualquier cliente. En el
// navegador normal (sin window.posOffline) se usa esta URL fija,
// como hasta ahora.
// Sin URL por defecto a propósito: cada instalación tiene su propio
// backend (config.json en modo navegador, o api_url guardada en SQLite
// en Electron). Si ninguna de las dos existe todavía, esta instalación
// no está configurada y login.html no debe poder validar credenciales
// contra el backend de otro cliente por error.
let API_URL = "";

// Puente con la app de escritorio. window.veekpos lo expone preload.js
// ANTES de que cargue esta página; window.posOffline (el alias que arma
// pos-offline.js) recién aparece un rato después. Antes se miraba solo
// posOffline: al abrir el login todavía no existía, la página se creía
// "navegador" y buscaba config.json en la carpeta de instalación — que
// se borra en cada reinstalación de la app.
function puenteEscritorio(){
  return window.posOffline || window.veekpos || null;
}

async function leerApiUrlEscritorio(puente){
  try{
    if(typeof puente.obtenerApiUrl === "function") return (await puente.obtenerApiUrl()) || "";
    if(typeof puente.obtenerConfigLocal === "function") return (await puente.obtenerConfigLocal("api_url", "")) || "";
  }catch(e){
    console.error("No se pudo leer la URL guardada en esta PC:", e);
  }
  return "";
}

async function resolverApiUrl(){
  const puente = puenteEscritorio();
  if(puente){
    const guardada = await leerApiUrlEscritorio(puente);
    if(guardada){
      API_URL = guardada;
      return;
    }
    // Si está en Electron pero todavía no hay URL configurada, algo
    // falló al decidir mostrar setup.html antes que login.html —
    // por las dudas, volvemos a setup en vez de quedar sin URL.
    window.location.href = "setup.html";
    return;
  }

  // Navegador normal (sin Electron): mismo mecanismo que usa admin.js
  // (cargarConfigCliente) — leer config.json de esta instalación.
  try{
    // El archivo del cliente vive en la raíz del sitio (../config.json);
    // "config.json" al lado de login.html queda solo por compatibilidad.
    let res = await fetch("../config.json?_=" + Date.now(), { cache: "no-store" }).catch(() => null);
    if(!res || !res.ok) res = await fetch("config.json?_=" + Date.now(), { cache: "no-store" });
    if(res.ok){
      const cfg = await res.json();
      if(cfg.apiUrl){
        API_URL = cfg.apiUrl;
      }
    }
  }catch(error){
    console.log("config.json no encontrado");
  }

  if(!API_URL){
    mostrarErrorLogin("Esta instalación todavía no tiene configurada la API URL del backend (falta config.json).");
    const btn = document.getElementById("btnLogin");
    if(btn) btn.disabled = true;
  }
}

/**
 * Aplica al DOM la letra/nombre de "Apariencia del panel admin" —
 * separado de dónde vienen los datos (caché local o backend) para
 * poder llamarlo dos veces: una con lo cacheado (instantáneo) y otra
 * con lo real, cuando llegue.
 */
function aplicarMarcaAlDom(config){
  const markEl = document.getElementById("loginMark");
  const textoEl = document.getElementById("loginLabelTexto");

  if(markEl && config.sidebarMark){
    markEl.textContent = config.sidebarMark.toUpperCase();
  }
  if(textoEl && config.sidebarTexto){
    textoEl.textContent = config.sidebarTexto.toUpperCase();
  }
}

/**
 * Trae la letra/nombre configurados en Configuración → "Apariencia del
 * panel admin" (mismo endpoint que ya usa el sidebar del admin).
 *
 * En la app de escritorio, primero se aplica lo último guardado en
 * SQLite (mismo caché que usa admin.js) — así el nombre real del
 * negocio aparece de una, sin esperar a Apps Script, que es lo que
 * antes hacía que este badge tardara varios segundos en mostrarse. La
 * versión real se sigue pidiendo después, en segundo plano, y si
 * cambió algo se actualiza sola y se vuelve a guardar en caché.
 *
 * En navegador (sin Electron) no hay SQLite disponible — se sigue
 * pidiendo en vivo, como antes. Si falla la conexión en cualquiera de
 * los dos casos, la página sigue mostrando "J" / "JIREH" fijos del
 * HTML, así que nunca se queda en blanco por esto.
 */
async function aplicarMarcaDesdeBackend(){
  const enElectron = !!puenteEscritorio() && typeof puenteEscritorio().obtenerConfigNegocioCache === "function";

  if(enElectron){
    try{
      const cacheado = await puenteEscritorio().obtenerConfigNegocioCache();
      if(cacheado) aplicarMarcaAlDom(cacheado);
    }catch(error){
      console.error("No se pudo leer la marca cacheada:", error);
    }
  }

  try{
    const r = await fetch(API_URL + "?action=configuracionNegocio");
    const data = await r.json();
    if(!data.success || !data.config) return;

    aplicarMarcaAlDom(data.config);

    if(enElectron){
      try{ await puenteEscritorio().guardarConfigNegocioCache(data.config); }
      catch(error){ console.error("No se pudo guardar la marca en caché:", error); }
    }

  }catch(error){
    console.error("No se pudo cargar la marca del panel:", error);
  }
}

resolverApiUrl().then(aplicarMarcaDesdeBackend);

/* ---------- Local / depósito (solo app de escritorio) ----------------
 * La misma PC trabaja con dos backends. La clave de siempre entra al
 * local; la del depósito, al depósito. Cada uno tiene su carpeta de
 * datos, así que cambiar de uno a otro reinicia la app y el ingreso se
 * completa solo del otro lado (ver desktop/src/perfiles.js).
 */
const NOMBRE_PERFIL = { local: "el local", deposito: "el depósito" };

function tienePerfiles(){
  const p = puenteEscritorio();
  return !!(p && typeof p.perfilInfo === "function");
}

function mostrarCambioDePerfil(perfil){
  const t = document.querySelector(".login-btn-text");
  if(t) t.textContent = "Abriendo " + (NOMBRE_PERFIL[perfil] || perfil) + "…";
  const btn = document.getElementById("btnLogin");
  if(btn){ btn.disabled = true; btn.classList.add("loading"); }
}

/** Deja la sesión abierta en esta página (login online exitoso) */
async function aplicarSesion(data, usuario, password){
  if(window.VeekAuth) VeekAuth.guardarSesion(data, !!puenteEscritorio());
  if(data.debeCambiarPassword) sessionStorage.setItem("debeCambiarPassword", "1");
  else sessionStorage.removeItem("debeCambiarPassword");
  sessionStorage.removeItem("veekEntroSinServidor");
  sessionStorage.setItem("admin", "true");
  sessionStorage.setItem("rol", data.rol || "admin");
  sessionStorage.setItem("nombreUsuario", data.nombre || "");
  sessionStorage.setItem("usuarioLogueado", data.usuario || usuario);
  sessionStorage.setItem("modoNegocio", data.modo || "");
  if(password){
    await guardarLoginOfflineCache(usuario, password, data);
    if(tienePerfiles()) { try{ await puenteEscritorio().perfilRegistrarCredencial(usuario, password); }catch(e){} }
  }
}

/** Login contra un backend dado (POST: la contraseña nunca va en la URL) */
async function pedirLogin(url, usuario, password, ms){
  const controlador = new AbortController();
  const timeoutId = setTimeout(() => controlador.abort(), ms || 30000);
  try{
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "login", usuario, password, dispositivo: puenteEscritorio() ? "1" : "" }),
      signal: controlador.signal
    });
    return await r.json();
  }finally{
    clearTimeout(timeoutId);
  }
}

/** Pasa al otro perfil y reinicia la app; el ingreso se completa del otro lado */
async function cambiarDePerfil(perfil, usuario, password, sesion){
  mostrarCambioDePerfil(perfil);
  const r = await puenteEscritorio().perfilCambiar({ perfil, usuario, password, sesion: sesion || null });
  if(!r || !r.success){
    mostrarErrorLogin((r && r.message) || "No se pudo abrir " + (NOMBRE_PERFIL[perfil] || perfil) + ".");
    const btn = document.getElementById("btnLogin");
    if(btn){ btn.disabled = false; btn.classList.remove("loading"); }
    const t = document.querySelector(".login-btn-text"); if(t) t.textContent = "Ingresar";
  }
  return r;
}

/** Al abrir: si se viene del otro perfil, se completa el ingreso solo */
(async function completarCambioDePerfil(){
  if(!tienePerfiles()) return;
  let pend = null;
  try{ pend = await puenteEscritorio().perfilTomarPendiente(); }catch(e){}
  if(!pend) return;
  if(pend.sesion && pend.sesion.success && pend.sesion.token){
    await aplicarSesion(pend.sesion, pend.usuario, pend.password);
    window.location.href = "index.html";
    return;
  }
  if(pend.usuario && pend.password){
    // Sin sesión (se cambió sin internet o por la clave recordada): ingreso normal
    document.getElementById("usuario").value = pend.usuario;
    document.getElementById("password").value = pend.password;
    await resolverApiUrl();
    document.getElementById("loginForm").requestSubmit();
  }
})();

/**
 * Login offline (solo Electron) ---------------------------------
 *
 * Antes, si fallaba el fetch a Apps Script (sin internet), no había
 * ningún otro camino: la persona quedaba trabada en este login por
 * más que la licencia todavía esté en su período de gracia y toda la
 * base de datos local esté lista para trabajar sin conexión. Esto
 * pasa siempre que se reabre la app entera (no solo recargar la
 * ventana) sin internet — sessionStorage se borra en cada arranque
 * nuevo, así que hay que loguearse de nuevo.
 *
 * La solución: cada vez que un login online sale bien, se guarda acá
 * (config local en SQLite, vía el mismo bridge que ya usa el resto de
 * la app) un hash de usuario+contraseña junto con el rol — nunca la
 * contraseña en texto plano. Si el próximo login falla puntualmente
 * porque no hay conexión (no por usuario/contraseña incorrectos,
 * evidentemente, porque ni siquiera se pudo consultar), y las
 * credenciales ingresadas coinciden con el hash guardado la última
 * vez que sí se validó con éxito, se deja entrar en "modo offline".
 */

// Pasado este tiempo sin un login online, se exige validar contra el backend (por si se cambio la clave o se dio de baja al usuario).
const VIGENCIA_LOGIN_LOCAL_MS = 7 * 24 * 60 * 60 * 1000;

// Formato viejo (SHA-256 sin sal): se sigue aceptando para no dejar
// afuera a nadie, y se reemplaza por el nuevo en el próximo login online.
async function hashCredencialViejo(usuario, password){
  const datos = new TextEncoder().encode("veekpos:" + usuario.toLowerCase() + ":" + password);
  const buffer = await crypto.subtle.digest("SHA-256", datos);
  return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// Formato nuevo: PBKDF2 con sal aleatoria y 150.000 iteraciones — mucho
// más caro de adivinar por fuerza bruta si alguien copia la base local.
async function hashCredencial(usuario, password, salHex){
  const aHex = (buf) => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  const sal = salHex
    ? new Uint8Array(salHex.match(/../g).map(h => parseInt(h, 16)))
    : crypto.getRandomValues(new Uint8Array(16));
  const clave = await crypto.subtle.importKey("raw", new TextEncoder().encode(usuario.toLowerCase() + ":" + password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: sal, iterations: 150000 }, clave, 256);
  return "pbkdf2$" + aHex(sal) + "$" + aHex(bits);
}

async function coincideHashCredencial(usuario, password, guardado){
  guardado = String(guardado || "");
  if(guardado.indexOf("pbkdf2$") === 0){
    const sal = guardado.split("$")[1];
    return (await hashCredencial(usuario, password, sal)) === guardado;
  }
  return (await hashCredencialViejo(usuario, password)) === guardado;
}

async function guardarLoginOfflineCache(usuario, password, data){
  if(!puenteEscritorio()) return; // solo tiene sentido en la app de escritorio
  try{
    const hash = await hashCredencial(usuario, password);
    await puenteEscritorio().fijarConfigLocal("login_offline_" + usuario.toLowerCase(), JSON.stringify({
      hash,
      rol: data.rol || "admin",
      nombre: data.nombre || "",
      usuario: data.usuario || usuario,
      modo: data.modo || "",
      guardadoEn: Date.now()
    }));
  }catch(error){
    console.error("No se pudo guardar el login offline:", error);
  }
}

/** Devuelve los datos de sesión si usuario/contraseña coinciden con el último login válido guardado, o null. */
async function intentarLoginOffline(usuario, password){
  if(!puenteEscritorio()) return null;
  try{
    const guardado = await puenteEscritorio().obtenerConfigLocal("login_offline_" + usuario.toLowerCase(), null);
    if(!guardado) return null;
    const cache = JSON.parse(guardado);
    if(!(await coincideHashCredencial(usuario, password, cache.hash))) return null;
    return cache;
  }catch(error){
    console.error("Error al validar login offline:", error);
    return null;
  }
}


function togglePassword(){
  const input = document.getElementById("password");
  const btn = document.getElementById("btnTogglePass");
  const mostrando = input.type === "text";
  input.type = mostrando ? "password" : "text";
  btn.textContent = mostrando ? "Ver" : "Ocultar";
}

function mostrarErrorLogin(mensaje){
  const errorBox = document.getElementById("loginError");
  document.getElementById("loginErrorTexto").textContent = mensaje;
  errorBox.classList.add("show");
}

function ocultarErrorLogin(){
  document.getElementById("loginError").classList.remove("show");
}

/**
 * La clave no sirvió en este backend: si hay otro configurado (local ↔
 * depósito), se prueba ahí. Devuelve true si se está cambiando de perfil.
 */
async function probarOtroPerfil(usuario, password){
  let info;
  try{ info = await puenteEscritorio().perfilInfo(); }catch(e){ return false; }
  const url = info && info.urls && info.urls[info.otro];
  if(!url) return false;
  try{
    const data = await pedirLogin(url, usuario, password, 30000);
    if(data && data.success){
      await cambiarDePerfil(info.otro, usuario, password, data);
      return true;
    }
  }catch(e){
    console.warn("No se pudo consultar el otro backend:", e);
  }
  return false;
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  ocultarErrorLogin();

  // Electron: primero se intenta el ingreso LOCAL (hash guardado en
  // SQLite tras el ultimo login online exitoso) para entrar al instante.
  // Si no coincide (contrasena cambiada, usuario nuevo, cache vencida),
  // sigue el camino normal contra Apps Script, que ademas refresca el hash.
  if(puenteEscritorio()){
    const u = document.getElementById("usuario").value.trim();
    const p = document.getElementById("password").value;
    // Clave que la última vez entró al otro backend (local ↔ depósito): se cambia directo
    if(u && p && tienePerfiles()){
      try{
        const [info, perfilClave] = await Promise.all([puenteEscritorio().perfilInfo(), puenteEscritorio().perfilDeCredencial(u, p)]);
        if(perfilClave && perfilClave !== info.activo){ await cambiarDePerfil(perfilClave, u, p, null); return; }
      }catch(e){}
    }
    if(u && p){
      const local = await intentarLoginOffline(u, p);
      const vigente = local && local.guardadoEn && (Date.now() - local.guardadoEn) < VIGENCIA_LOGIN_LOCAL_MS;
      // Solo se entra "al instante" si este equipo además tiene una sesión
      // de dispositivo vigente con el backend; si no, se valida online
      // (así se obtiene un token nuevo y la cola puede sincronizar).
      const conSesion = window.VeekAuth ? VeekAuth.tieneSesion() : true;
      if(vigente && conSesion){
        sessionStorage.setItem("admin", "true");
        sessionStorage.setItem("rol", local.rol || "admin");
        sessionStorage.setItem("nombreUsuario", local.nombre || "");
        sessionStorage.setItem("usuarioLogueado", local.usuario || u);
        sessionStorage.setItem("modoNegocio", local.modo || "");
        window.location.href = "index.html";
        return;
      }
    }
  }

  // Por si el click llegó antes de que resolverApiUrl() terminara
  // (lectura local, debería tardar milisegundos, pero por las dudas).
  await resolverApiUrl();

  const usuario = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value;

  if(!usuario || !password){
    mostrarErrorLogin("Completá usuario y contraseña.");
    return;
  }

  if(!API_URL){
    mostrarErrorLogin("Esta instalación todavía no tiene configurada la API URL del backend (falta config.json).");
    return;
  }

  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  btn.classList.add("loading");

  try{

    // Login contra el backend. Apps Script puede tardar bastante en la
    // primera llamada después de publicar una versión nueva (o tras un
    // rato sin uso): antes se cortaba a los 12s y la app entraba en modo
    // offline SIN sesión del servidor (y después no podía subir nada).
    // Ahora: hasta 30s, y si hay red, un segundo intento antes de rendirse.
    const cuerpoLogin = JSON.stringify({ action: "login", usuario, password, dispositivo: (window.posOffline || window.veekpos) ? "1" : "" });
    const intentarLoginOnline = async (ms) => {
      const controlador = new AbortController();
      const timeoutId = setTimeout(() => controlador.abort(), ms);
      try{
        // Por POST: usuario y contraseña nunca viajan en la URL.
        return await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: cuerpoLogin,
          signal: controlador.signal
        });
      }finally{
        clearTimeout(timeoutId);
      }
    };

    let r;
    try{
      r = await intentarLoginOnline(30000);
    }catch(primerError){
      if(navigator.onLine === false) throw primerError;
      r = await intentarLoginOnline(30000);
    }

    const data = await r.json();

    if(data.success){
      await aplicarSesion(data, usuario, password);
      window.location.href = "index.html";
    }else if(!data.bloqueado && tienePerfiles() && await probarOtroPerfil(usuario, password)){
      return; // la clave es del otro backend: la app se reinicia en ese perfil
    }else{
      mostrarErrorLogin(data.bloqueado ? (data.message || "Demasiados intentos. Esperá 15 minutos.") : "Usuario o contraseña incorrectos.");
      btn.disabled = false;
      btn.classList.remove("loading");
    }

  }catch(error){
    console.error("Error de conexión al iniciar sesión:", error);

    // El fetch en sí falló (sin internet, no un usuario/contraseña
    // rechazado por el servidor) — antes de rendirse, se prueba con
    // el último login que sí validó bien estando online.
    const cache = await intentarLoginOffline(usuario, password);
    if(cache){
      // Entró sin validar con el servidor: el aviso del panel lo explica así
      // (y no como "sesión vencida").
      sessionStorage.setItem("veekEntroSinServidor", "1");
      sessionStorage.setItem("admin", "true");
      sessionStorage.setItem("rol", cache.rol || "admin");
      sessionStorage.setItem("nombreUsuario", cache.nombre || "");
      sessionStorage.setItem("usuarioLogueado", cache.usuario || usuario);
      sessionStorage.setItem("modoNegocio", cache.modo || "");
      window.location.href = "index.html";
      return;
    }

    mostrarErrorLogin(
      puenteEscritorio()
        ? "No se pudo conectar y no hay un ingreso offline guardado para este usuario. Conectate a internet al menos una vez con este usuario y contraseña para habilitar el acceso sin conexión."
        : "No se pudo conectar. Revisá tu conexión e intentá de nuevo."
    );
    btn.disabled = false;
    btn.classList.remove("loading");
  }

});

</script>

</html>
